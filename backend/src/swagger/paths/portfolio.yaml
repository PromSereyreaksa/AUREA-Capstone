paths:
  /api/v1/portfolio/public:
    get:
      summary: Browse public portfolios
      description: |
        Returns a paginated list of public portfolios that have uploaded PDFs.
        Supports search by designer name and skills, and filtering by categories.
        
        **No authentication required.**
      tags:
        - Portfolio
      parameters:
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          description: Number of items per page (max 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 9
            example: 9
        - name: search
          in: query
          description: Search term to filter by designer first name, last name, or skills
          schema:
            type: string
            maxLength: 100
            example: "john"
        - name: category_ids
          in: query
          description: Comma-separated category IDs to filter by (matches ANY)
          schema:
            type: string
            example: "1,2,3"
      responses:
        '200':
          description: Public portfolios retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicPortfolioItem'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /api/v1/portfolio/public/{id}:
    get:
      summary: Get a single public portfolio by id
      description: |
        Returns a single public portfolio by its ID.

        - Only portfolios marked as public (`is_public = true`) and with a non-null `portfolio_url` are returned.
        - If the portfolio does not exist or is not public, a 404 response is returned.

        **No authentication required.**
      tags:
        - Portfolio
      parameters:
        - name: id
          in: path
          required: true
          description: Portfolio ID
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        '200':
          description: Public portfolio retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Public portfolio retrieved successfully"
                  data:
                    $ref: '#/components/schemas/PublicPortfolioItem'
        '400':
          description: Invalid portfolio id
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invalid portfolio id"
        '404':
          description: Portfolio not found or not public
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Portfolio not found or not public"

  /api/v1/portfolio/categories:
    get:
      summary: Get all categories
      description: |
        Returns all available categories for portfolio filtering.
        
        **No authentication required.**
      tags:
        - Portfolio
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Categories retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

  /api/v1/portfolio:
    get:
      summary: Get user's portfolio
      description: |
        Retrieves the portfolio of the authenticated user.
        Returns the portfolio URL (public Supabase Storage URL) and settings.
      tags:
        - Portfolio
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Portfolio retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Portfolio retrieved successfully"
                  data:
                    $ref: '#/components/schemas/Portfolio'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Portfolio not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Portfolio not found"

    put:
      summary: Update portfolio settings
      description: |
        Updates the portfolio settings for the authenticated user.
        Currently only supports updating the is_public flag.
      tags:
        - Portfolio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_public:
                  type: boolean
                  description: Whether the portfolio is publicly visible
                  example: true
      responses:
        '200':
          description: Portfolio updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Portfolio updated successfully"
                  data:
                    $ref: '#/components/schemas/Portfolio'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/portfolio/pdf:
    post:
      summary: Upload portfolio PDF
      description: |
        Uploads a PDF file as the user's portfolio.
        The file is stored in Supabase Storage (user_portfolio bucket).
        If a portfolio already exists, the old PDF is deleted and replaced.
        
        **File Requirements:**
        - Format: PDF only
        - Max size: 10MB
      tags:
        - Portfolio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - pdf
              properties:
                pdf:
                  type: string
                  format: binary
                  description: PDF file to upload (max 10MB)
      responses:
        '200':
          description: Portfolio PDF uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Portfolio PDF uploaded successfully"
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Portfolio PDF uploaded successfully"
                      portfolio_id:
                        type: integer
                        example: 1
                      user_id:
                        type: integer
                        example: 80
                      portfolio_url:
                        type: string
                        description: Public URL to access the PDF
                        example: "https://xxx.supabase.co/storage/v1/object/public/user_portfolio/80/abc123.pdf"
                      is_public:
                        type: boolean
                        example: false
        '400':
          description: Bad request (no file or invalid file)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "No PDF file provided"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    delete:
      summary: Delete portfolio PDF
      description: |
        Deletes the user's portfolio PDF from Supabase Storage.
        Also removes the portfolio_url from the database.
      tags:
        - Portfolio
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Portfolio PDF deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Portfolio PDF deleted successfully"
                  data:
                    type: 'null'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: No portfolio PDF found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "No portfolio PDF found"

components:
  schemas:
    Portfolio:
      type: object
      properties:
        portfolio_id:
          type: integer
          description: Unique portfolio identifier
          example: 1
        user_id:
          type: integer
          description: ID of the portfolio owner
          example: 80
        portfolio_url:
          type: string
          nullable: true
          description: Public URL to the portfolio PDF in Supabase Storage
          example: "https://xxx.supabase.co/storage/v1/object/public/user_portfolio/80/abc123.pdf"
        is_public:
          type: boolean
          description: Whether the portfolio is publicly visible
          example: false

    PublicPortfolioItem:
      type: object
      properties:
        portfolio_id:
          type: integer
          description: Unique portfolio identifier
          example: 1
        portfolio_url:
          type: string
          description: Public URL to the portfolio PDF
          example: "https://xxx.supabase.co/storage/v1/object/public/user_portfolio/80/abc123.pdf"
        is_public:
          type: boolean
          example: true
        user_id:
          type: integer
          description: ID of the portfolio owner
          example: 80
        first_name:
          type: string
          description: Designer's first name
          example: "John"
        last_name:
          type: string
          description: Designer's last name
          example: "Doe"
        profile_avatar:
          type: string
          nullable: true
          description: URL to the designer's avatar image
          example: "https://xxx.supabase.co/storage/v1/object/public/avatars/80.jpg"
        skills:
          type: array
          items:
            type: string
          description: Designer's skills
          example: ["Logo Design", "Branding", "UI/UX"]
        seniority_level:
          type: string
          nullable: true
          enum: [junior, mid, senior, expert]
          description: Designer's seniority level
          example: "mid"
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
          description: Categories associated with this portfolio

    Category:
      type: object
      properties:
        category_id:
          type: integer
          description: Unique category identifier
          example: 1
        category_name:
          type: string
          description: Name of the category
          example: "Logo Design"

    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: Current page number
          example: 1
        limit:
          type: integer
          description: Items per page
          example: 9
        total:
          type: integer
          description: Total number of items
          example: 25
        totalPages:
          type: integer
          description: Total number of pages
          example: 3
        hasMore:
          type: boolean
          description: Whether there are more pages
          example: true
